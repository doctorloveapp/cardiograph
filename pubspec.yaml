name: cardiograph
description: Diario personale della pressione, locale e senza account.
publish_to: none
version: 1.3.0+5
environment:
  sdk: '>=3.10.4 <3.11.0'
  flutter: '>=3.38.5 <3.39.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  flutter_riverpod: 3.3.2
  go_router: 17.5.0
  drift: 2.35.4
  sqlite3: 3.5.2
  flutter_secure_storage: 11.2.0
  camera: 0.12.0+2
  google_mlkit_text_recognition: 0.16.0
  fl_chart: 1.3.1
  table_calendar: 3.2.1
  pdf: 3.12.0
  printing: 5.14.3
  flutter_local_notifications: 20.1.0
  timezone: 0.10.1
  flutter_timezone: 5.1.1
  intl: 0.20.2
  file_selector: 1.1.0
  share_plus: 13.3.1
  cryptography: 2.9.0
  image: 4.5.4
  path_provider: 2.1.6
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/sviluppatore.jpg
    - assets/fonts/Roboto-Regular.ttf
